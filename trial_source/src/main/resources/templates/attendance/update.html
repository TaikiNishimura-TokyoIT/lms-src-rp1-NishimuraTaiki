<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8">
	<title>勤怠情報変更｜LMS</title>
</head>

<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post">
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w140">コース内容</th>
							<th class="w60"></th>
							<th class="w180" colspan="3">出勤</th>
							<th class="w180" colspan="3">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w140">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|"
										th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|"
										th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|"
										th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|"
										th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|"
										th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|"
										th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td> <!-- 日付 -->
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td> <!-- コース内容 -->
								<td class="w60">
									<button type="button" class="btn btn-success"
										onclick="setRegularTime(this);">定時</button>
								</td>
								<!-- 出勤 -->
								<td class="w70"> <select
										th:name="|attendanceList[${stat.index}].trainingStartTimeHourValue|"
										class="form-control">
										<option
											th:each="trainingStartTimeHour : ${dailyAttendanceForm.trainingStartTimeHour}"
											th:value="${trainingStartTimeHour.key}"
											th:text="${trainingStartTimeHour.value}"
											th:selected="${trainingStartTimeHour.key == dailyAttendanceForm.trainingStartTimeHourValue}">
										</option>
									</select> </td>
								<td>:</td>
								<td class="w70"> <select
										th:name="|attendanceList[${stat.index}].trainingStartTimeMinuteValue|"
										class="form-control">
										<option
											th:each="trainingStartTimeMinute : ${dailyAttendanceForm.trainingStartTimeMinute}"
											th:value="${trainingStartTimeMinute.key}"
											th:text="${trainingStartTimeMinute.value}"
											th:selected="${trainingStartTimeMinute.key == dailyAttendanceForm.trainingStartTimeMinuteValue}">
										</option>
									</select> </td>
								<!-- 退勤 -->
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHourValue|"
										class="form-control">
										<option
											th:each="trainingEndTimeHour : ${dailyAttendanceForm.trainingEndTimeHour}"
											th:value="${trainingEndTimeHour.key}" th:text="${trainingEndTimeHour.value}"
											th:selected="${trainingEndTimeHour.key == dailyAttendanceForm.trainingEndTimeHourValue}">
										</option>
									</select>
								</td>
								<td>:</td>
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinuteValue|"
										class="form-control">
										<option
											th:each="trainingEndTimeMinute : ${dailyAttendanceForm.trainingEndTimeMinute}"
											th:value="${trainingEndTimeMinute.key}"
											th:text="${trainingEndTimeMinute.value}"
											th:selected="${trainingEndTimeMinute.key == dailyAttendanceForm.trainingEndTimeMinuteValue}">
										</option>
									</select>
								</td>
								<td class="w80"> <!-- 中抜け時間 -->
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}"
											th:value="${blankTime.key}" th:inline="text" class="form-control"
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">
											[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td> <!-- ステータス -->
								<td class="w240"> <!-- 備考 -->
									<input type="text" th:name="|attendanceList[${stat.index}].note|"
										th:value="${dailyAttendanceForm.note}" class="form-control"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>

					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>

					<!-- 更新確認ダイアログを追加 -->
					<input type="submit" value="更新" name="complete" class="btn btn-info"
						onclick="return confirm('更新します。よろしいですか？');" />
				</div>

			</form>

		</div>
	</div>

	<script>
		function setRegularTime(button) { // 「定時」ボタンが押された行を取得
			const row = button.closest('tr');
			const startHour = row.querySelector('select[name$="trainingStartTimeHourValue"]');
			const startMinute = row.querySelector('select[name$="trainingStartTimeMinuteValue"]');
			const endHour = row.querySelector('select[name$="trainingEndTimeHourValue"]');
			const endMinute = row.querySelector('select[name$="trainingEndTimeMinuteValue"]');
			setSelectByText(startHour, '09'); setSelectByText(startMinute, '00'); // 出勤 09:00
			setSelectByText(endHour, '18'); setSelectByText(endMinute, '00');     // 退勤 18:00
		}
		function setSelectByText(select, text) {for (const option of select.options) {if (option.text === text) {select.value = option.value; return;} } }
	</script>

</body>

</html>
